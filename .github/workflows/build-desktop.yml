name: Build desktop app (Linux + Windows)

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/server/**'
      - '.github/workflows/build-desktop.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # No AppImage here: this workflow builds on every push, and the format
          # is assembled by its own best-effort job in release.yml, which starts
          # the server out of the artifact before publishing it. Building it on
          # every push would spend seven minutes proving what a tag already
          # proves.
          - platform: ubuntu-22.04
            os: linux
            bundle: deb
            tauriArgs: --bundles deb
            best_effort: false
          - platform: windows-latest
            os: windows
            bundle: msi, nsis
            tauriArgs: --bundles msi,nsis
            best_effort: false

    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.best_effort }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the server binary the bundle carries
        run: |
          # The desktop app hosts the server, so the bundle has to contain it.
          # scripts/desktop-sidecar.sh stages it as a bundle resource
          # (apps/desktop/src-tauri/resources/); without it `tauri build` fails
          # on a missing resource.
          pnpm desktop:sidecar
        shell: bash

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The AppImage fix, identical to release.yml and for the same reason:
          # linuxdeploy's bundled `strip` is binutils 2.35 and cannot read the
          # `.relr.dyn` sections of glibc >= 2.36, and the bundler reports that as
          # a bare `failed to run linuxdeploy`. See release.yml for the full note.
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          projectPath: apps/desktop
          args: ${{ matrix.tauriArgs }}
          uploadWorkflowArtifacts: true