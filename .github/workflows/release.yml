name: Release

# Creates a GitHub Release automatically for every `v*` tag, builds the app
# on Linux + Windows in the cloud and attaches the bundles as release assets.
# Usage: `git tag v0.2.0 && git push --tags` — done, everything else is automatic.

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The AppImage is built by its own job below, and only published if
          # it runs. It is not in this matrix because this matrix's artifacts go
          # straight onto the release, and a package that cannot be trusted until
          # somebody has started it does not belong on a download list.
          - platform: ubuntu-22.04
            os: linux
            bundle: deb
            tauriArgs: --bundles deb
            best_effort: false
          - platform: windows-latest
            os: windows
            bundle: msi, nsis
            tauriArgs: --bundles msi,nsis
            best_effort: false

    runs-on: ${{ matrix.platform }}
    continue-on-error: ${{ matrix.best_effort }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      # bun compiles the server into a single binary, and the desktop bundle now
      # has to contain it as a sidecar.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the server binary the bundle carries
        run: |
          # The desktop app hosts the server, so the bundle has to contain it.
          # scripts/desktop-sidecar.sh builds it and stages it as a bundle
          # resource (apps/desktop/src-tauri/resources/lantern-server); without
          # it `tauri build` fails on a missing resource.
          pnpm desktop:sidecar
        shell: bash


      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPIMAGE_EXTRACT_AND_RUN and libfuse2 are the FUSE story: the runners
          # have no FUSE, so the helper images are extracted rather than mounted.
          # NO_STRIP skips linuxdeploy's bundled `strip`, which is binutils 2.35
          # and cannot read the `.relr.dyn` sections of glibc >= 2.36. Neither was
          # enough to make AppImage bundling reliable here, which is why that half
          # is its own best-effort job above — but both are free and both narrow
          # the ways it can fail.
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
          RUST_LOG: tauri_bundler=debug
        with:
          projectPath: apps/desktop
          args: ${{ matrix.tauriArgs }}
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false


  # Headless distribution: the standalone server binary plus the built web
  # client, so the whole system can run without Tauri.
  #
  # Note: this job creates the release if the desktop build has not got there
  # yet, and tauri-action then updates its name and body - so the release notes
  # are written by hand afterwards (`gh release edit v0.x.y --notes-file …`).
  server:
    name: Standalone server (Linux)
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the release version
        id: version
        run: echo "version=$(node -p "require('./apps/server/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build the web client
        run: pnpm build:web

      - name: Build the standalone server binary
        run: pnpm build:server

      # The console only appears on a terminal, so this runs it on a pty and then
      # checks the opposite case: a piped run must stay machine-readable, or
      # systemd, journalctl and this workflow stop working.
      - name: Smoke-test the console
        run: bash scripts/console-smoke.sh --no-build

      - name: Smoke-test the artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rel-data"
          ADMIN_PASSWORD=ci-smoke-test \
            ./apps/server/dist/lantern-server \
              --port 3499 \
              --data "$RUNNER_TEMP/rel-data" \
              --webroot apps/web-client/dist &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3499/api/health -o "$RUNNER_TEMP/health.json"; then break; fi
            sleep 0.5
          done
          cat "$RUNNER_TEMP/health.json"
          curl -sf -o /dev/null -w 'web root: HTTP %{http_code}\n' http://127.0.0.1:3499/
          node -e "
            const health = require('$RUNNER_TEMP/health.json')
            if (health.version !== '${{ steps.version.outputs.version }}') {
              console.error('version mismatch: ' + health.version)
              process.exit(1)
            }
            if (health.database !== 'ok') {
              console.error('database not ok')
              process.exit(1)
            }
          "

      - name: Package the artifacts
        run: |
          cp apps/server/dist/lantern-server "lantern-server_${{ steps.version.outputs.version }}_linux-x64"
          tar -czf "lantern-web_${{ steps.version.outputs.version }}.tar.gz" -C apps/web-client dist

      - name: Upload the artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # This job usually finishes before the desktop build creates the
          # release, so create it when it is missing. `gh release upload` only
          # needs permission to add assets.
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes "See the assets to download this version and install."
          fi
          gh release upload "${{ github.ref_name }}" \
            "lantern-server_${{ steps.version.outputs.version }}_linux-x64" \
            "lantern-web_${{ steps.version.outputs.version }}.tar.gz" \
            --clobber

  # The AppImage - and only if it runs.
  #
  # This is the format that has been missing since 0.5.1, for one reason:
  # linuxdeploy runs patchelf over every ELF in the bundle's usr/bin to set an
  # rpath, and on a `bun build --compile` binary that rewrite corrupts it. The
  # bundle builds, uploads, and the app segfaults in silence on startup - and
  # nothing structural notices, because readelf and ldd are both content.
  #
  # The server is a bundle *resource* now (usr/lib/LANtern/lantern-server) rather
  # than an externalBin, so that pass never sees it. This job proves it the only
  # way that counts: it extracts the produced AppImage and starts the server from
  # inside it. Best-effort on purpose - a package that may not build must not be
  # able to take a release down with it.
  appimage:
    name: AppImage (Linux, best effort)
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the server binary the bundle carries
        run: pnpm desktop:sidecar
        shell: bash

      - name: Bundle the AppImage
        env:
          # linuxdeploy's bundled `strip` is binutils 2.35 and cannot read the
          # `.relr.dyn` sections of glibc >= 2.36; APPIMAGE_EXTRACT_AND_RUN is
          # the FUSE story, because the runners have no FUSE. Neither is the fix
          # for the corruption - they only narrow the ways this can fail.
          NO_STRIP: 'true'
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm --filter @lantern/desktop tauri build --bundles appimage

      - name: Start the server out of the artifact
        run: |
          set -euo pipefail
          appimage="$(ls apps/desktop/src-tauri/target/release/bundle/appimage/LANtern_*_amd64.AppImage)"
          echo "artifact: $appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --appimage-extract >/dev/null
          server="$(find squashfs-root -name lantern-server -type f | head -1)"
          if [ -z "$server" ]; then
            echo "the AppImage carries no server binary" >&2
            exit 1
          fi
          # The server has no display of its own: starting it and asking for
          # health is the whole check, and it needs no xvfb.
          "$server" --port 3499 --data ./appimage-data --no-console > ./server.log 2>&1 &
          server_pid=$!
          ok=''
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3499/api/health > ./health.json; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "the bundled server never answered - the artifact is not shippable" >&2
            cat ./server.log >&2 || true
            kill "$server_pid" 2>/dev/null || true
            exit 1
          fi
          cat ./health.json
          kill "$server_pid" 2>/dev/null || true

      - name: Upload the artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          appimage="$(ls apps/desktop/src-tauri/target/release/bundle/appimage/LANtern_*_amd64.AppImage)"
          # The release usually exists by now; create it when it does not, the
          # same way the server job does.
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes "See the assets to download this version and install."
          fi
          gh release upload "${{ github.ref_name }}" "$appimage" --clobber
