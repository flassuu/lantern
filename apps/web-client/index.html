<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fdfbff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131318" />
    <meta name="description" content="LANtern - run classroom tests on your own network, with no internet." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <!-- Relative, like every other asset: the build is served from wherever the
         server is pointed, not only from a domain root. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>LANtern</title>
    <script>
      // Apply the persisted theme before first paint to avoid a light flash.
      ;(function () {
        var stored = localStorage.getItem('theme')
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
